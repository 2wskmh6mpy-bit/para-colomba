<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi pollito ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #151218;
      color: white;
      font-family: Georgia, serif;
      text-align: center;
    }

    .contenedor {
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      opacity: 0.85;
    }

    button {
      margin-top: 25px;
      padding: 14px 30px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 30px;
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: white;
      color: #151218;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <h1>Para mi pollito ❤️</h1>

    <p>Tengo algo preparado para ti...</p>

    <button onclick="alert('Te quiero muchísimo, Colomba ❤️')">
      Entrar ✨
    </button>
  </div>

</body>
</html>
